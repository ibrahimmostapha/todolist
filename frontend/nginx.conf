server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so Nginx can resolve "backend" at runtime
    # (and still start cleanly when testing the frontend container standalone)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy API calls to the Express backend container
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support React Router client-side routes (/signin, /signup, /todos)
    location / {
        try_files $uri $uri/ /index.html;
    }
}